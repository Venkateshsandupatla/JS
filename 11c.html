<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11c</title>
</head>
<body>

  <script>

    function arraySwap(array){
      const temp = array[0];
      array[0] = array[array.length-1];
      array[array.length-1] = temp;
      return array;
    }

    const arr = [1,20,22,24,5];
    console.log(arraySwap(arr));

    const worr = ['hi','hello','goodmorning'];

    console.log(arraySwap(worr));
  </script>
  
</body>
</html>
