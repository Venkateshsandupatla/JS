<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrays-and-loops</title>
</head>
<body>
  <script>
    const myArray  = [10,20,30];
    console.log(myArray);
    console.log(myArray[1]);
    myArray[0] = 1;
    console.log(myArray);

    // we can write objects inside the array also arrays inside the arraay
   // [1,'hello',2,7,true,{name: 'sokcs'},[1,22,2]]
    console.log(typeof([1,2]));
    console.log(Array.isArray([1,2]));
    // shows the lenghth of array
    console.log(myArray.length);

    // to add an element at the end of ur array
    myArray.push(123);
    console.log(myArray);


    // to remove an element from the array we use splice 
    // (0,1) ==> 0 is the index we want to remove
    // 1 ==> is Number of values we want to remove.
    myArray.splice(0,1);
    console.log(myArray);


    //loops
    // while loop

    let i = 1;
    while(i<=5){
      console.log(i);
      i = i + 1;
    }

    // for loop

    for(let j=0; j<=5;j++){
      console.log(j);
    }    

     let randomNumber = 0;
     while(randomNumber<0.5){
      randomNumber = Math.random();
     }
     console.log(randomNumber);

     const todoArray = [
      'make dishes',
      'wash dishes',
      'eat food'
     ];
     for(let i = 0; i<=todoArray.length-1;i++){
      const value = todoArray[i];
      console.log(value);
     }

     const nums = [1,1,3];
     let total =0;
     for(let i =0;i <nums.length;i++){
      const num = nums[i];
      total+= num;
     }
     console.log(total);

     // now lets create an other array which are the double of nums elements like 2,2,6
     let doubleArray = [];
     for(let i =0; i<nums.length;i++){
      const num = nums[i]*2;
      doubleArray[i] = num;
      // doubleArray.push(num);
     }
     console.log(doubleArray);

</script>
</body>
</html>
