<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11k</title>
</head>
<body>
  
  <script>

    function countPositive(nums){
      let count =0;
      for(let i =0;i<nums.length;i++){
        if(nums[i]>0){
          count++;
        }
      }
      return count;
    }

    const arr = [1,-3,5,-2,23,321,21331];
    console.log(countPositive(arr));
  </script>
</body>
</html>
