<body>
  
  <script>


    function addNum(array,num){
      for(let i =0;i<array.length;i++){
        array[i] = array[i] + num;

      }
      return array;
    }
    
    const arr = [1,1,2];
    console.log(addNum(arr,3));
  </script>
