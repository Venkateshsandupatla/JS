<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11g</title>
</head>
<body>


  <script>
    
    const newarray =[];
    function increaseby1(array){
      for(let i =0;i<array.length;i++){
        newarray[i] = array[i]+1;
      }
      return newarray;
    };

    const arr = [1,2,3];
    console.log(increaseby1(arr));
  </script>
  
</body>
</html>
